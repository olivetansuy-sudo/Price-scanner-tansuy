<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Store Price Scanner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #f0f2f5; text-align: center; color: #1c1e21; }
        h2 { margin: 0 0 10px 0; font-size: 20px; }
        .card { background: white; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto 12px auto; }
        #camera-container { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; max-height: 260px; object-fit: cover; }
        canvas { display: none; }
        input { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px; border: 1px solid #ccd0d5; border-radius: 8px; margin-bottom: 8px; }
        button { width: 100%; padding: 13px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-scan { background: #10b981; font-size: 18px; }
        .btn-add { background: #2563eb; }
        .btn-key { background: #4b5563; padding: 10px; font-size: 14px; }
        .btn-backup { background: #6b7280; padding: 8px; font-size: 13px; width: 48%; display: inline-block; }
        #result { font-size: 17px; font-weight: 600; min-height: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .price-tag { font-size: 28px; color: #10b981; font-weight: 800; margin-top: 2px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; text-align: left; }
        .item-row:last-child { border-bottom: none; }
        .item-row img { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; margin-right: 10px; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 10px; font-size: 12px; }
        details { text-align: left; font-size: 14px; color: #4b5563; }
        summary { font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🤖 AI Visual Price Scanner</h2>

    <!-- API Key Setup -->
    <div class="card">
        <details id="keyBox">
            <summary>⚙️ AI Setup (API Key)</summary>
            <p style="font-size:12px; margin:6px 0;">Paste your free Google AI Studio key below.</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
            <button class="btn-key" onclick="saveApiKey()">Save API Key</button>
        </details>
    </div>

    <!-- Camera & Scan -->
    <div class="card">
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>
        
        <div id="result" style="margin: 12px 0;">Point camera at an item</div>
        <button id="scanBtn" class="btn-scan" onclick="scanItem()">🔍 Scan & Check Price</button>
    </div>

    <!-- Instant Add New Item -->
    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px; text-align:left;">⚡ Instant Add Material</h3>
        <input type="text" id="itemName" placeholder="Material Name (e.g., 1/2 PVC Elbow)">
        <input type="number" id="itemPrice" placeholder="Price (e.g., 25.00)" step="0.01">
        <button id="addBtn" class="btn-add" onclick="saveItem()">📸 Snap & Save Instantly</button>
    </div>

    <!-- Saved Inventory -->
    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px; text-align:left;">Saved Materials (<span id="count">0</span>)</h3>
        <div id="items"></div>
        <div style="margin-top:12px; display:flex; justify-content:space-between;">
            <button class="btn-backup" onclick="exportData()">⬇️ Backup List</button>
            <button class="btn-backup" onclick="importData()">⬆️ Restore List</button>
        </div>
    </div>

    <script>
        const MODELS = [
            "gemini-3.5-flash-lite",
            "gemini-3.6-flash",
            "gemini-3.8-flash"
        ];
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let inventory = JSON.parse(localStorage.getItem('aiStoreInventoryV2')) || [];
        let apiKey = localStorage.getItem('geminiApiKey') || '';

        if (!apiKey) {
            document.getElementById('keyBox').open = true;
        } else {
            document.getElementById('apiKeyInput').value = apiKey;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(() => { setResult("⚠️ Camera blocked. Allow camera permissions."); });

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (!val) return alert("Paste a valid API key.");
            apiKey = val;
            localStorage.setItem('geminiApiKey', apiKey);
            document.getElementById('keyBox').open = false;
            alert("API Key saved!");
        }

        function setResult(html) {
            document.getElementById('result').innerHTML = html;
        }

        // Fast, lightweight photo capture (320px) for instant saving & rapid AI upload
        function captureFastPhoto() {
            const size = 320;
            const aspect = (video.videoHeight / video.videoWidth) || 1;
            canvas.width = size;
            canvas.height = Math.round(size * aspect);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
            return {
                dataUrl,
                base64: dataUrl.split(',')[1]
            };
        }

        // 0-second instant save (no internet wait)
        function saveItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            if (!name || !price) return alert("Enter both material name and price.");

            const { dataUrl, base64 } = captureFastPhoto();

            inventory.unshift({
                id: Date.now(),
                name,
                price: parseFloat(price).toFixed(2),
                dataUrl,
                base64
            });

            try {
                localStorage.setItem('aiStoreInventoryV2', JSON.stringify(inventory));
            } catch (e) {
                inventory.shift();
                return alert("Phone storage full! Delete old items or backup your list.");
            }

            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            setResult(`✅ Saved: <b>${name}</b> (₱${parseFloat(price).toFixed(2)})`);
            renderInventory();
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function callGeminiWithParts(parts) {
            if (!apiKey) {
                document.getElementById('keyBox').open = true;
                throw new Error("Enter your Gemini API Key at the top first.");
            }

            let lastError = null;

            for (const model of MODELS) {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-goog-api-key': apiKey
                            },
                            body: JSON.stringify({ contents: [{ parts }] })
                        });

                        const data = await response.json();
                        if (response.ok) {
                            return data.candidates[0].content.parts[0].text;
                        }

                        lastError = data.error?.message || `Error ${response.status}`;

                        if (response.status === 503 || response.status === 429) {
                            setResult(`⏳ Server busy, switching backup AI...`);
                            await sleep(1200);
                            continue;
                        }
                        if (response.status === 404 || lastError.includes("no longer available")) break;
                        if (lastError.includes("API key")) throw new Error(lastError);
                        break;
                    } catch (err) {
                        lastError = err.message;
                        if (lastError.includes("API key")) throw err;
                    }
                }
            }
            throw new Error(lastError || "AI servers busy. Try again.");
        }

        async function scanItem() {
            if (inventory.length === 0) return setResult("Inventory is empty! Save an item first.");

            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            setResult("🔍 Comparing with saved photos...");

            try {
                const livePhoto = captureFastPhoto();

                // Build visual comparison prompt with live photo + reference catalog photos
                const parts = [
                    { text: "TARGET PHOTO TO IDENTIFY:" },
                    { inline_data: { mime_type: "image/jpeg", data: livePhoto.base64 } },
                    { text: "Compare the TARGET PHOTO above against these saved store catalog items and find the exact match:" }
                ];

                // Send up to 40 most recent items visually for fast matching
                const itemsToCompare = inventory.slice(0, 40);
                itemsToCompare.forEach(item => {
                    parts.push({ text: `\nItem ID: ${item.id} | Name: ${item.name}` });
                    parts.push({ inline_data: { mime_type: "image/jpeg", data: item.base64 } });
                });

                parts.push({
                    text: `\nRespond ONLY with valid JSON (no markdown): {"matchedId": number_or_null, "confidence": "high" | "medium" | "low", "reason": "4-word reason"}`
                });

                const rawReply = await callGeminiWithParts(parts);
                const cleanJson = rawReply.replace(/```json|```/g, '').trim();
                const match = JSON.parse(cleanJson);
                const found = inventory.find(i => i.id === match.matchedId);

                if (found && match.confidence !== "low") {
                    setResult(`
                        <span>${found.name}</span>
                        <span class="price-tag">₱${found.price}</span>
                        <span style="font-size:12px; color:#666; font-weight:normal;">(${match.reason})</span>
                    `);
                } else {
                    setResult(`❓ Not recognized.<br><span style="font-size:13px; color:#666; font-weight:normal;">Get closer or save it below.</span>`);
                }
            } catch (err) {
                setResult(`❌ ${err.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function deleteItem(id) {
            if (!confirm("Delete this item?")) return;
            inventory = inventory.filter(item => item.id !== id);
            localStorage.setItem('aiStoreInventoryV2', JSON.stringify(inventory));
            renderInventory();
        }

        function renderInventory() {
            document.getElementById('count').innerText = inventory.length;
            document.getElementById('items').innerHTML = inventory.map(item => `
                <div class="item-row">
                    <div style="display:flex; align-items:center;">
                        <img src="${item.dataUrl}">
                        <div>
                            <b>${item.name}</b><br>
                            <span style="color:#10b981; font-weight:bold;">₱${item.price}</span>
                        </div>
                    </div>
                    <button class="btn-del" onclick="deleteItem(${item.id})">✕</button>
                </div>
            `).join('');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(inventory)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `store-prices-backup.json`;
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        inventory = JSON.parse(ev.target.result);
                        localStorage.setItem('aiStoreInventoryV2', JSON.stringify(inventory));
                        renderInventory();
                        alert("Backup restored!");
                    } catch {
                        alert("Invalid backup file.");
                    }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        renderInventory();
    </script>
</body>
</html>
